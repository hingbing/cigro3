services:
  postgres-test:
    image: postgres:16
    ports: ["55432:5432"]
    environment:
      POSTGRES_DB: loungefit_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loungefit_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [loungefit-test-data:/var/lib/postgresql/data]
volumes:
  loungefit-test-data:
